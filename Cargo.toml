# Standalone manifest for `ariadne-scip`, extracted from the `ariadne`
# workspace on 2026-09-09 (`git subtree split -P crates/ariadne-scip`, twelve
# commits of its own history preserved).
#
# Why it left: the crate is a leaf with one consumer, it needs `ariadne-core`
# for a single enum, and it carries the whole protobuf surface — `prost`,
# `prost-types`, and in [build-dependencies] `prost-build` plus
# `protoc-bin-vendored`, which ships `protoc` bytes. Its cadence follows the
# SCIP schema (`proto/SCIP_COMMIT`), not the workspace's releases.
#
# `ariadne-core` comes from the workspace's own repository by git url, so this
# crate builds from a fresh clone with nothing beside it — both repositories
# are public, so no credential is involved. The consumer side unifies the two
# copies: `mind-decay/Ariadne`'s root manifest carries a `[patch]` mapping this
# url onto its local `crates/ariadne-core`, so the composition root links one
# core and one `ScipFacts`.
[package]
name = "ariadne-scip"
description = "Driven adapter: SCIP subprocess + protobuf Indexer port implementation."
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Ariadne contributors"]
repository = "https://github.com/mind-decay/ariadne-scip"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
ariadne-core = { git = "https://github.com/mind-decay/Ariadne.git", branch = "main" }
thiserror = "2"
prost = "0.14"
prost-types = "0.14"
blake3 = "1"
rayon = "1"
tempfile = "3"
tracing = "0.1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
proptest = "1"
insta = "1"
