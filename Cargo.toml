# Standalone manifest for `ariadne-scip`, extracted from the `ariadne`
# workspace on 2026-09-09 (`git subtree split -P crates/ariadne-scip`, twelve
# commits of its own history preserved).
#
# Why it left: the crate is a leaf with one consumer, it needs `ariadne-core`
# for a single enum, and it carries the whole protobuf surface — `prost`,
# `prost-types`, and in [build-dependencies] `prost-build` plus
# `protoc-bin-vendored`, which ships `protoc` bytes. Its cadence follows the
# SCIP schema (`proto/SCIP_COMMIT`), not the workspace's releases.
#
# `ariadne-core` is a path dependency into the sibling checkout rather than a
# git one: this repository's `origin` is a local bare clone, so a git
# dependency would pin a sha nobody outside this machine can fetch either
# way. The honest consequence is that this crate does not build from a fresh
# clone alone — recorded in `docs/PILOT.md §5` of the hodos build.
[package]
name = "ariadne-scip"
description = "Driven adapter: SCIP subprocess + protobuf Indexer port implementation."
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Ariadne contributors"]
repository = "https://github.com/mind-decay/ariadne-scip"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
ariadne-core = { path = "../ariadne_v2/crates/ariadne-core" }
thiserror = "2"
prost = "0.14"
prost-types = "0.14"
blake3 = "1"
rayon = "1"
tempfile = "3"
tracing = "0.1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
proptest = "1"
insta = "1"
